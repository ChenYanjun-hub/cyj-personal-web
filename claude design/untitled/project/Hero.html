<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>陈彦均 — 个人网页</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #D8552E;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
            "Helvetica Neue", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: #fbfbfd;
    color: #1d1d1f;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { height: 100vh; width: 100vw; }

  .stage {
    position: relative;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    /* per-treatment theme tokens */
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --paper: #fbfbfd;
    background: var(--paper);
    color: var(--ink);
    transition: background .6s ease, color .6s ease;
    --cx: 50vw; --cy: 50vh; --mx: 0px; --my: 0px;
  }
  .stage[data-treat="dark"]      { --ink: #f5f5f7; --ink-2: rgba(245,245,247,.66); --paper: #0e0f12; }
  .stage[data-treat="blueprint"] { --ink: #eaf2ff; --ink-2: rgba(234,242,255,.66); --paper: #081427; }

  /* ---------- background drawing ---------- */
  .bg {
    position: absolute;
    inset: -5%;
    background-image: url("assets/hero-bg.png");
    background-size: cover;
    background-position: center;
    transform: translate(var(--mx), var(--my)) scale(1.05);
    transition: transform .6s cubic-bezier(.2,.7,.2,1), filter .6s ease;
    will-change: transform;
  }
  .stage[data-treat="line"]      .bg { filter: contrast(1.0) brightness(1.03); }
  .stage[data-treat="spot"]      .bg { filter: contrast(1.0) brightness(1.03); }
  .stage[data-treat="dark"]      .bg { filter: invert(1) contrast(1.12) brightness(0.66) grayscale(1); }
  .stage[data-treat="blueprint"] .bg { filter: invert(1) brightness(0.92) sepia(1) hue-rotate(168deg) saturate(4) contrast(1.04); }

  /* ---------- legibility veil ---------- */
  .veil { position: absolute; inset: 0; pointer-events: none; transition: background .6s ease; }
  .stage[data-treat="line"] .veil {
    background:
      radial-gradient(130% 105% at 50% 44%, rgba(251,251,253,.9) 0%, rgba(251,251,253,.66) 34%, rgba(251,251,253,.28) 62%, rgba(251,251,253,.05) 100%),
      linear-gradient(180deg, rgba(251,251,253,.92) 0%, rgba(251,251,253,0) 15%),
      linear-gradient(0deg, rgba(251,251,253,.92) 0%, rgba(251,251,253,0) 16%);
  }
  .stage[data-treat="spot"] .veil {
    background:
      radial-gradient(circle 26vw at var(--cx) var(--cy), rgba(251,251,253,.08) 0%, rgba(251,251,253,.5) 46%, rgba(251,251,253,.93) 100%),
      linear-gradient(180deg, rgba(251,251,253,.9) 0%, rgba(251,251,253,0) 15%),
      linear-gradient(0deg, rgba(251,251,253,.9) 0%, rgba(251,251,253,0) 16%);
  }
  .stage[data-treat="dark"] .veil {
    background:
      radial-gradient(130% 105% at 50% 44%, rgba(14,15,18,.78) 0%, rgba(14,15,18,.5) 36%, rgba(14,15,18,.16) 66%, rgba(14,15,18,0) 100%),
      linear-gradient(180deg, rgba(14,15,18,.85) 0%, rgba(14,15,18,0) 16%),
      linear-gradient(0deg, rgba(14,15,18,.85) 0%, rgba(14,15,18,0) 16%);
  }
  .stage[data-treat="blueprint"] .veil {
    background:
      radial-gradient(130% 105% at 50% 44%, rgba(8,20,39,.8) 0%, rgba(8,20,39,.52) 36%, rgba(8,20,39,.16) 66%, rgba(8,20,39,0) 100%),
      linear-gradient(180deg, rgba(8,20,39,.86) 0%, rgba(8,20,39,0) 16%),
      linear-gradient(0deg, rgba(8,20,39,.86) 0%, rgba(8,20,39,0) 16%);
  }

  /* ---------- crosshair cursor + coordinate (signature) ---------- */
  .cross { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
  .cross .h, .cross .v { position: absolute; background: var(--accent); opacity: .5; }
  .cross .h { left: 0; right: 0; height: 1px; top: var(--cy); }
  .cross .v { top: 0; bottom: 0; width: 1px; left: var(--cx); }
  .cross .dot {
    position: absolute; left: var(--cx); top: var(--cy);
    width: 32px; height: 32px; margin: -16px 0 0 -16px;
    border: 1px solid var(--accent); border-radius: 50%; opacity: .7;
  }
  .cross .dot::before, .cross .dot::after { content:""; position:absolute; background: var(--accent); }
  .cross .dot::before { left: 50%; top: 7px; bottom: 7px; width: 1px; transform: translateX(-.5px); }
  .cross .dot::after  { top: 50%; left: 7px; right: 7px; height: 1px; transform: translateY(-.5px); }
  .coord {
    position: absolute; left: var(--cx); top: var(--cy); transform: translate(20px, 12px);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: .04em; color: var(--accent);
    z-index: 41; pointer-events: none; white-space: nowrap;
  }
  .stage[data-cross="on"] { cursor: none; }
  .stage[data-cross="off"] .cross, .stage[data-cross="off"] .coord { display: none; }
  @media (hover: none), (max-width: 760px) {
    .stage { cursor: auto !important; }
    .cross, .coord { display: none !important; }
  }

  /* ---------- top nav (Apple-slim) ---------- */
  nav {
    position: absolute; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px clamp(24px, 5vw, 64px) 0;
  }
  .brand { font-size: 17px; font-weight: 600; letter-spacing: .01em; color: var(--ink); }
  .brand .en { color: var(--ink-2); font-weight: 400; margin-left: 8px; font-size: 13px; letter-spacing: .04em; }
  .navlinks { display: flex; gap: clamp(16px, 2.4vw, 34px); }
  .navlinks a {
    color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 400; letter-spacing: .01em;
    transition: color .2s ease;
  }
  .navlinks a:hover { color: var(--ink); }
  .loaded nav { animation: fade .8s ease both .15s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- centered hero ---------- */
  .hero {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 24px;
    gap: 0;
  }
  .stage[data-layout="left"] .hero {
    align-items: flex-start; text-align: left;
    padding-left: clamp(24px, 7vw, 110px); padding-right: 24px;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: clamp(14px, 1.4vw, 19px); font-weight: 600; letter-spacing: .01em;
    color: var(--accent); margin-bottom: 20px;
  }
  .eyebrow .label {
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-2); border: 1px solid currentColor; border-radius: 100px;
    padding: 3px 10px; opacity: .8;
  }
  .eyebrow .en { color: var(--ink-2); font-weight: 400; letter-spacing: .04em; font-size: .82em; }

  .name {
    font-size: clamp(62px, 9.4vw, 138px); font-weight: 600; letter-spacing: -.025em; line-height: .98;
    color: var(--ink);
  }
  .name .char { display: inline-block; }

  .tagline {
    margin-top: clamp(14px, 1.8vw, 26px);
    font-size: clamp(22px, 3.3vw, 46px); font-weight: 500; letter-spacing: -.012em; line-height: 1.08;
    color: var(--ink-2); white-space: nowrap;
  }
  .tagline .op { color: var(--accent); font-weight: 600; padding: 0 .12em; }
  .tagline .em { color: var(--ink); }

  .caption {
    margin-top: 18px; font-size: clamp(13px, 1.3vw, 17px); font-weight: 400; letter-spacing: .03em;
    color: var(--ink-2);
  }
  .caption .dot { color: var(--accent); margin: 0 9px; }

  .links {
    display: flex; align-items: center; gap: clamp(20px, 3vw, 40px); margin-top: clamp(30px, 4vw, 50px);
  }
  .stage[data-layout="left"] .links { justify-content: flex-start; }
  .links a {
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    color: var(--accent); font-size: clamp(16px, 1.7vw, 21px); font-weight: 400; letter-spacing: .01em;
  }
  .links a .chev { transition: transform .25s ease; }
  .links a:hover .txt { text-decoration: underline; text-underline-offset: 4px; }
  .links a:hover .chev { transform: translateX(4px); }
  .links a.solid {
    background: var(--accent); color: #fff; padding: 12px 26px; border-radius: 980px;
    transition: filter .2s ease, transform .2s ease;
  }
  .links a.solid .chev { color: rgba(255,255,255,.8); }
  .links a.solid:hover { filter: brightness(1.08); }
  .links a.solid:hover .txt { text-decoration: none; }

  .keys {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0; margin-top: clamp(26px, 3.4vw, 40px);
    font-size: clamp(12px, 1.2vw, 15px); font-weight: 400; color: var(--ink-2); letter-spacing: .02em;
    justify-content: center; max-width: 720px;
  }
  .stage[data-layout="left"] .keys { justify-content: flex-start; }
  .keys span { padding: 0 14px; position: relative; }
  .keys span:not(:last-child)::after {
    content: ""; position: absolute; right: -1px; top: 50%; width: 3px; height: 3px; margin-top: -1.5px;
    border-radius: 50%; background: var(--accent); opacity: .7;
  }

  /* entrance staging */
  .reveal { opacity: 0; transform: translateY(22px); }
  .loaded .reveal { animation: rise .9s cubic-bezier(.16,.84,.3,1) both; }
  .loaded .d1 { animation-delay: .20s; }
  .loaded .d2 { animation-delay: .32s; }
  .loaded .d3 { animation-delay: .46s; }
  .loaded .d4 { animation-delay: .58s; }
  .loaded .d5 { animation-delay: .70s; }
  .loaded .d6 { animation-delay: .82s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; animation: none !important; }
  }

  /* ---------- bottom availability + scroll ---------- */
  .footer {
    position: absolute; left: 0; right: 0; bottom: 26px; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2);
  }
  .footer .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: #1f8a5b;
    box-shadow: 0 0 0 0 rgba(31,138,91,.5); animation: pulse 2.6s infinite;
  }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(31,138,91,.45);} 70%{box-shadow:0 0 0 9px rgba(31,138,91,0);} 100%{box-shadow:0 0 0 0 rgba(31,138,91,0);} }
  .loaded .footer { animation: fade 1s ease both 1s; }

  .scrollcue {
    position: absolute; left: 50%; bottom: 58px; z-index: 20;
    color: var(--ink-2); opacity: 0;
  }
  .loaded .scrollcue { animation: cueIn 1s ease forwards 1.15s, bob 2.4s ease-in-out infinite 1.15s; }
  @keyframes cueIn { to { opacity: .7; } }
  @keyframes bob { 0%,100%{ transform: translate(-50%,0);} 50%{ transform: translate(-50%,7px);} }

  @media (max-width: 760px) {
    .navlinks { display: none; }
    .footer { display: none; }
    .tagline { font-size: clamp(18px, 6vw, 30px); }
    .keys { display: none; }
  }
</style>
<link id="gfont-Pacifico" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico:wght@300;400;500;600;700&amp;display=swap">
<link id="gfont-Permanent-Marker" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker:wght@300;400;500;600;700&amp;display=swap">
<link id="gfont-Architects-Daughter" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter:wght@300;400;500;600;700&amp;display=swap">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</body>
