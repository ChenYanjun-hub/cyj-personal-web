# Nginx 反代配置模板 · cyjpersonalweb.cn
# ---------------------------------------------------------------
# 用法：
#   1. 拷贝到 /etc/nginx/sites-available/cyjpersonalweb.cn.conf
#   2. ln -s /etc/nginx/sites-available/cyjpersonalweb.cn.conf /etc/nginx/sites-enabled/
#   3. nginx -t      # 检查语法
#   4. nginx -s reload
#
# 假设：
#   - Next.js 由 PM2 跑在 127.0.0.1:3000
#   - SSL 证书由阿里云 / Let's Encrypt 签发，放在 /etc/letsencrypt/live/cyjpersonalweb.cn/
#   - 服务器在阿里云华东 1（上海），中国大陆访问

# ===============================================================
# 第 1 块 · HTTP → HTTPS 301 重定向（含 www → 主域名）
# ===============================================================
server {
    listen 80;
    listen [::]:80;
    server_name cyjpersonalweb.cn www.cyjpersonalweb.cn;

    # Let's Encrypt 续签时需要的 challenge 路径不走 301
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://cyjpersonalweb.cn$request_uri;
    }
}

# ===============================================================
# 第 2 块 · www → 主域名 301（HTTPS 层）
# ===============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cyjpersonalweb.cn;

    ssl_certificate     /etc/letsencrypt/live/cyjpersonalweb.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyjpersonalweb.cn/privkey.pem;

    return 301 https://cyjpersonalweb.cn$request_uri;
}

# ===============================================================
# 第 3 块 · 主域名（实际反代到 Next.js）
# ===============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cyjpersonalweb.cn;

    # ----------- SSL -----------
    ssl_certificate     /etc/letsencrypt/live/cyjpersonalweb.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyjpersonalweb.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ----------- 安全头 -----------
    # HSTS · 1 年（让浏览器记住强制 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 防点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    # MIME 嗅探防护
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----------- 上传 / 单次请求大小 -----------
    # AI 分身可能粘贴长 JD（1000 字以内），10MB 足够
    client_max_body_size 10M;

    # ----------- gzip 压缩 -----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ===============================================================
    # 路由 1 · Next.js 静态资源（/_next/static/...）
    # ===============================================================
    # 这部分是 build 产物 · 文件名带 hash · 永远可以长期缓存
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1 年长 cache（文件名含 hash，安全）
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ===============================================================
    # 路由 2 · public/ 下静态资源（图片等）
    # ===============================================================
    location ~* \.(png|jpg|jpeg|gif|ico|webp|svg|woff2?|ttf|otf)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 7 天 cache（这些图可能被替换，所以不像 _next/static 那么长）
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ===============================================================
    # 路由 3 · AI 分身 API · 流式响应不能 buffer
    # ===============================================================
    location /api/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 关键：禁用 buffer，让 SSE 流式响应可以实时到达浏览器
        # （后端 route.ts 也有 X-Accel-Buffering: no 头，双保险）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 不缓存任何 API 响应
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ===============================================================
    # 路由 4 · 兜底 · 所有其他请求反代到 Next.js
    # ===============================================================
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Next.js 自己处理 cache-control（静态预渲染的 / 是 immutable）
        proxy_read_timeout 60s;
    }

    # ===============================================================
    # 日志
    # ===============================================================
    access_log /var/log/nginx/cyjpersonalweb.access.log;
    error_log  /var/log/nginx/cyjpersonalweb.error.log warn;
}
