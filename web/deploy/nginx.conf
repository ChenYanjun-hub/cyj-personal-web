# Nginx 反向代理 · 陈彦均个人站（Next.js + PM2，监听 127.0.0.1:3000）
# ---------------------------------------------------------------
# 用法：
#   1. 改下面的 server_name 为你的备案域名
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/cyjweb.conf
#   3. sudo ln -s /etc/nginx/sites-available/cyjweb.conf /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. 跑 certbot 自动加 HTTPS（见 deploy/README.md）——它会改写本文件加 443 块
#
# 备案提醒：大陆服务器对外开 80 需域名已备案（你已通过）。备案接入也要放行 80。

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;   # ← 改成你的备案域名

    # 留言板 POST 体很小，给 2M 足够（也防超大请求）
    client_max_body_size 2m;

    # gzip（Next 静态资源/HTML 文本压缩，省流量）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 传递真实客户端 IP —— /api/chat 的频率限制按 x-forwarded-for / x-real-ip 取 IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # AI 分身是流式（chunked text/plain）响应：关掉缓冲，逐字返回不卡顿
    location /api/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;        # 流式关键：不缓冲
        proxy_cache off;
        proxy_read_timeout 300s;    # 长回答留足时间
    }
}
