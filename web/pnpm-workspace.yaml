# pnpm 工作区配置文件
# allowBuilds: 允许哪些依赖在安装时执行 build/post-install 脚本（pnpm 11 安全机制，需显式 true）
# - sharp：Next.js next/image 的 native 图片处理模块，必须允许 build，否则生产构建失败
# - better-sqlite3：留言板用的 native SQLite 驱动，需 build / 拉预编译二进制
# ignoredBuiltDependencies: 显式忽略、不需要 build 的依赖
allowBuilds:
  sharp: true
  better-sqlite3: true
ignoredBuiltDependencies:
  - unrs-resolver
